name: Run Unit/Integration/End-to-End Tests
on:
  push:
    branches:
      - develop
      - staging

  pull_request:
    branches-ignore:
      - main

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test

  integration-tests:
    name: Live Integration Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: Production – bm-staging
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run live integration tests
        run: test -n "$PURPLE_AIR_API_KEY" && yarn test:integration
        env:
          PURPLE_AIR_API_KEY: ${{ secrets.PURPLE_AIR_API_KEY }}

  e2e-tests:
    name: End-to-end Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Waiting for 200 from the Vercel Preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        id: waitFor200
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check_interval: 15
          max_timeout: 1200

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright Browsers
        run: yarn playwright install chromium --only-shell

      - name: Run Playwright tests
        run: yarn e2e
        env:
          APP_URL: ${{ steps.waitFor200.outputs.url }}
